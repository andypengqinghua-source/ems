version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: foerp-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'Your_password123'
    ports:
      - '1433:1433'
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
